[package]
name = "cli"
version = "0.1.0"
edition = "2021"
description = "A server based on Deno runtime, capable of running JavaScript, TypeScript, and WASM services"

[[bin]]
name = "edge-runtime"
path = "src/main.rs"

[dependencies]
deno.workspace = true
deno_core.workspace = true

deno_facade.workspace = true

ext_event_worker = { workspace = true, optional = true, features = ["tracing"] }

anyhow.workspace = true
base.workspace = true
clap.workspace = true
glob.workspace = true
log.workspace = true
once_cell.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber = { workspace = true, optional = true }

ext_workers.workspace = true

regex.workspace = true
scopeguard.workspace = true
tempfile.workspace = true
pathdiff = "0.2"
env_logger = "=0.10.0"

[features]
tracing = ["dep:tracing-subscriber", "dep:ext_event_worker"]
